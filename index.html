<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finite by Design — Parasympathetic Pathways</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --amber:#c8902a;--amber-light:#f0c060;--amber-dark:#8a5a10;
  --bg:#0a0704;--bg2:#0f0c07;--bg3:#13100a;
  --text:#f0e6c8;--text2:#a09070;--text3:#5a4a2a;
  --green:#4aaa4a;--red:#aa3a2a;
  --ease:cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);min-height:100vh;color:var(--text);overflow-x:hidden}
body{font-family:'Inter',sans-serif}

/* ── TRANSITIONS ── */
.screen{position:absolute;inset:0;min-height:100vh;opacity:0;pointer-events:none;transition:opacity 0.6s var(--ease),transform 0.6s var(--ease);transform:translateY(20px)}
.screen.active{opacity:1;pointer-events:all;transform:translateY(0)}

/* ── FLAME ANIMATION ── */
@keyframes flicker{0%,100%{transform:scaleX(1) scaleY(1) rotate(-1deg)}25%{transform:scaleX(0.92) scaleY(1.06) rotate(1deg)}50%{transform:scaleX(1.05) scaleY(0.96) rotate(-0.5deg)}75%{transform:scaleX(0.95) scaleY(1.04) rotate(1.5deg)}}
@keyframes glowPulse{0%,100%{opacity:0.6}50%{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes walkL{0%,100%{d:path("M38 70 Q34 80 30 90")}50%{d:path("M38 70 Q36 80 40 90")}}
@keyframes walkR{0%,100%{d:path("M52 70 Q56 80 60 90")}50%{d:path("M52 70 Q50 80 46 90")}}
@keyframes avatarForward{from{transform:translateY(0)}50%{transform:translateY(-12px)}to{transform:translateY(0)}}
@keyframes avatarBack{from{transform:translateX(0)}to{transform:translateX(0)}0%{transform:translateX(0)}30%{transform:translateX(-10px)}60%{transform:translateX(6px)}100%{transform:translateX(0)}}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:0.6}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardReveal{from{opacity:0;transform:translateY(30px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes waveform{0%,100%{transform:scaleY(0.3)}50%{transform:scaleY(1)}}

/* ══ LANDING ══════════════════════════════════════════ */
#landing{background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3rem 2rem 2rem;overflow-y:auto}
.l-brand{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.35em;text-transform:uppercase;color:var(--text3);margin-bottom:1.5rem;animation:slideUp 0.8s var(--ease) both}
.l-title{font-family:'Cormorant Garamond',serif;font-size:56px;font-weight:300;line-height:1.05;text-align:center;color:var(--text);margin-bottom:0.5rem;animation:slideUp 0.8s 0.1s var(--ease) both}
.l-sub{font-size:14px;color:var(--text2);letter-spacing:0.06em;text-align:center;margin-bottom:2.5rem;animation:slideUp 0.8s 0.2s var(--ease) both}

.candle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;width:100%;max-width:720px;margin-bottom:2rem;animation:slideUp 0.8s 0.3s var(--ease) both}
.c-card{cursor:pointer;background:var(--bg2);border:0.5px solid var(--text3);border-radius:14px;padding:1.5rem 1rem 1rem;text-align:center;transition:all 0.3s var(--ease);position:relative;overflow:hidden}
.c-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(200,144,42,0.08) 0%,transparent 70%);opacity:0;transition:opacity 0.3s}
.c-card:hover::before,.c-card.chosen::before{opacity:1}
.c-card:hover{border-color:var(--amber);transform:translateY(-3px)}
.c-card.chosen{border-color:var(--amber);background:#1a1208;box-shadow:0 0 20px rgba(200,144,42,0.12)}
.c-flame-wrap{height:80px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:0.5rem}
.c-flame{transform-origin:bottom center;animation:flicker 2s ease-in-out infinite}
.c-waveform{display:flex;gap:2px;align-items:center;justify-content:center;height:14px;margin-bottom:8px}
.c-waveform span{width:2px;background:var(--amber);border-radius:1px;opacity:0.4;transform-origin:bottom}
.c-name{font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--amber);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.c-ganglion{font-size:11px;color:var(--text3);line-height:1.4}

.avatar-section{width:100%;max-width:720px;animation:slideUp 0.8s 0.4s var(--ease) both}
.section-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text3);margin-bottom:1rem;text-align:center}
.avatar-grid{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-bottom:2rem}
.av-card{cursor:pointer;background:var(--bg2);border:0.5px solid var(--text3);border-radius:12px;padding:1rem 0.75rem 0.75rem;text-align:center;transition:all 0.3s var(--ease);width:110px}
.av-card:hover{border-color:var(--amber);transform:translateY(-2px)}
.av-card.chosen{border-color:var(--amber);background:#1a1208}
.av-label{font-size:10px;color:var(--text2);margin-top:6px;line-height:1.4}

.start-btn{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;letter-spacing:0.12em;background:var(--amber);color:var(--bg);border:none;padding:16px 56px;border-radius:6px;cursor:pointer;transition:all 0.3s var(--ease);animation:slideUp 0.8s 0.5s var(--ease) both}
.start-btn:hover{background:var(--amber-light);transform:scale(1.02)}
.start-btn:disabled{background:var(--text3);color:#3a2a0a;cursor:not-allowed;transform:none}

/* ══ GAME ══════════════════════════════════════════════ */
#game{display:flex;flex-direction:column;background:var(--bg)}
.g-header{display:flex;align-items:center;justify-content:space-between;padding:0.875rem 1.5rem;border-bottom:0.5px solid #1a1208;z-index:10;background:var(--bg)}
.g-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;color:var(--amber);letter-spacing:0.06em}
.g-hright{display:flex;align-items:center;gap:16px}
.flame-bar-wrap{display:flex;align-items:center;gap:8px}
.flame-bar-bg{width:120px;height:6px;background:#1a1208;border-radius:3px;overflow:hidden;border:0.5px solid #2a1e0a}
.flame-bar-fill{height:100%;border-radius:3px;transition:width 0.5s var(--ease),background 0.5s}
.flame-pct{font-size:11px;color:var(--text2);min-width:32px;font-variant-numeric:tabular-nums}
.music-btn{background:transparent;border:0.5px solid var(--text3);color:var(--text2);padding:5px 12px;font-size:11px;cursor:pointer;border-radius:4px;font-family:'Inter',sans-serif;transition:all 0.2s;letter-spacing:0.05em}
.music-btn:hover{border-color:var(--amber);color:var(--amber)}

.g-body{display:flex;flex:1;height:calc(100vh - 52px)}

/* LEFT */
.g-left{width:260px;background:var(--bg2);border-right:0.5px solid #1a1208;padding:1.25rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto;flex-shrink:0}
.av-stage{text-align:center;position:relative;height:110px;margin-bottom:0.5rem}
.av-stage svg{transition:transform 0.6s var(--ease)}
.av-stage.forward svg{animation:avatarForward 0.6s var(--ease)}
.av-stage.backward svg{animation:shake 0.5s var(--ease)}
.prog-wrap{text-align:center}
.prog-label{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.prog-dots{display:flex;gap:10px;justify-content:center}
.p-dot{width:10px;height:10px;border-radius:50%;background:#1a1208;border:0.5px solid #2a1e0a;transition:all 0.4s var(--ease)}
.p-dot.done{background:var(--amber);border-color:var(--amber)}
.p-dot.curr{background:var(--amber-light);border-color:var(--amber-light);box-shadow:0 0 8px rgba(240,192,96,0.5)}
.step-card{background:var(--bg3);border-radius:10px;padding:1rem;border:0.5px solid #1a1208}
.step-tag{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.step-desc{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;color:#d0c0a0;line-height:1.65;margin-bottom:8px}
.step-fact{font-size:11px;color:var(--text3);line-height:1.65;border-left:2px solid #2a1e0a;padding-left:8px}

/* CENTER */
.g-center{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.anat-bg{position:absolute;inset:0;transition:opacity 0.8s var(--ease)}
.anat-bg svg{width:100%;height:100%}
.maze-overlay{position:absolute;inset:0;pointer-events:none}
.candle-live{position:absolute;bottom:20px;right:20px;filter:drop-shadow(0 0 12px rgba(200,144,42,0.4))}
.candle-live .flame{transform-origin:bottom center;animation:flicker 1.8s ease-in-out infinite}
.timer-wrap{position:absolute;top:16px;right:16px}

/* RIGHT */
.g-right{width:320px;background:var(--bg2);border-left:0.5px solid #1a1208;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;overflow-y:auto;flex-shrink:0}
.q-tag{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text2);margin-bottom:4px}
.q-text{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--text);line-height:1.55;animation:slideUp 0.4s var(--ease) both}
.answers{display:flex;flex-direction:column;gap:10px}
.ans-btn{cursor:pointer;border:0.5px solid #2a1e0a;border-radius:10px;padding:14px 18px;background:var(--bg3);color:#c8a060;font-size:15px;font-family:'Inter',sans-serif;text-align:left;transition:all 0.25s var(--ease);line-height:1.5;width:100%;position:relative;overflow:hidden}
.ans-btn::before{content:'';position:absolute;inset:0;background:var(--amber);opacity:0;transition:opacity 0.2s}
.ans-btn:hover{border-color:var(--amber);color:var(--text);transform:translateX(3px)}
.ans-btn.correct{border-color:var(--green);background:#061a06;color:#7adc7a;transform:none;cursor:default}
.ans-btn.wrong{border-color:var(--red);background:#1a0604;color:#dc7a6a;opacity:0.8;cursor:default}
.ans-btn:disabled{cursor:default}
.feedback{font-size:13px;line-height:1.65;padding:12px 14px;border-radius:8px;animation:slideUp 0.3s var(--ease) both}
.feedback.good{background:#061a06;color:#6acc6a;border:0.5px solid #1a4a1a}
.feedback.bad{background:#180604;color:#cc6a5a;border:0.5px solid #4a1a10}
.next-btn{font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:0.06em;background:transparent;border:0.5px solid var(--amber);color:var(--amber);padding:12px 20px;border-radius:6px;cursor:pointer;width:100%;transition:all 0.3s var(--ease);display:none}
.next-btn:hover{background:var(--amber);color:var(--bg)}

/* RESCUE */
.rescue-screen{position:absolute;inset:0;background:rgba(5,3,1,0.95);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}
.rescue-screen.show{display:flex;animation:fadeIn 0.4s var(--ease)}
.rescue-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;background:radial-gradient(circle,rgba(200,144,42,0.12) 0%,transparent 70%);pointer-events:none;animation:glowPulse 2s ease-in-out infinite}
.rescue-title{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--amber-light);margin-bottom:0.5rem;position:relative}
.rescue-sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem;line-height:1.6;position:relative}
.rescue-q{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--text);margin-bottom:1.25rem;line-height:1.55;max-width:500px;position:relative}
.rescue-opts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:480px;position:relative}
.rescue-opt{cursor:pointer;border:0.5px solid #2a1e0a;border-radius:10px;padding:13px 18px;background:var(--bg3);color:#c8a060;font-size:15px;font-family:'Inter',sans-serif;text-align:left;transition:all 0.25s}
.rescue-opt:hover{border-color:var(--amber);color:var(--text)}
.rescue-opt.correct{border-color:var(--green);background:#061a06;color:#7adc7a}
.rescue-opt.wrong{border-color:var(--red);background:#180604;color:#dc7a6a}
.rescue-fb{font-size:13px;color:#8adc8a;margin-top:10px;line-height:1.6;position:relative;min-height:20px}
.rescue-continue{font-family:'Cormorant Garamond',serif;font-size:16px;margin-top:14px;background:var(--amber);color:var(--bg);border:none;padding:12px 32px;border-radius:4px;cursor:pointer;display:none;position:relative;transition:all 0.2s}
.rescue-continue:hover{background:var(--amber-light)}

/* END */
#end{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem;text-align:center;overflow-y:auto}
.end-brand{font-family:'Cormorant Garamond',serif;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--text3);margin-bottom:1rem}
.end-title{font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:300;color:var(--text);margin-bottom:0.25rem}
.end-sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem}
.end-score{font-family:'Cormorant Garamond',serif;font-size:72px;color:var(--amber);font-weight:300;line-height:1}
.end-score-label{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text3);margin-bottom:2rem}
.end-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:580px;margin-bottom:2rem}
.end-card{background:var(--bg2);border:0.5px solid #2a1e0a;border-radius:10px;padding:16px;text-align:left;opacity:0;animation:cardReveal 0.5s var(--ease) forwards}
.end-card-g{font-size:10px;color:var(--amber);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px}
.end-card-e{font-size:12px;color:var(--text3);line-height:1.6}
.share-text{font-size:12px;color:var(--text3);background:var(--bg3);border:0.5px solid #2a1e0a;border-radius:6px;padding:10px 16px;margin-bottom:1.5rem;cursor:pointer;max-width:480px;line-height:1.6;transition:border-color 0.2s}
.share-text:hover{border-color:var(--amber)}
.end-btn{font-family:'Cormorant Garamond',serif;font-size:16px;background:transparent;border:0.5px solid var(--amber);color:var(--amber);padding:12px 36px;border-radius:4px;cursor:pointer;transition:all 0.2s}
.end-btn:hover{background:var(--amber);color:var(--bg)}

@media(max-width:900px){
  .g-body{flex-direction:column;height:auto}
  .g-left,.g-right{width:100%;border:none;border-bottom:0.5px solid #1a1208;max-height:none}
  .g-center{min-height:300px}
  .candle-grid{grid-template-columns:repeat(2,1fr)}
  .end-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ══ SCREENS ══ -->
<div id="landing" class="screen active"></div>
<div id="game" class="screen"></div>
<div id="end" class="screen"></div>

<script>
// ════════════════════════════════════════════════════
// AUDIO
// ════════════════════════════════════════════════════
let AC=null,musicOn=true,activeNodes=[];
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function stopAll(){activeNodes.forEach(n=>{try{n.stop(0)}catch(e){}});activeNodes=[];}

function playAmbient(type){
  stopAll();if(!musicOn)return;
  const ctx=ac();
  const master=ctx.createGain();master.gain.value=0.14;master.connect(ctx.destination);
  const moods={
    landing:{base:130.8,notes:[1,1.25,1.5,2],wave:'sine',bpm:1.8},
    ciliary:{base:220,notes:[1,1.122,1.335,1.498,1.782],wave:'triangle',bpm:1.5},
    pterygopalatine:{base:174.6,notes:[1,1.189,1.498,1.587,2],wave:'sine',bpm:2.2},
    submandibular:{base:146.8,notes:[1,1.122,1.335,1.782],wave:'triangle',bpm:1.8},
    otic:{base:110,notes:[1,1.189,1.498,1.587],wave:'sine',bpm:2.8}
  };
  const m=moods[type]||moods.landing;
  const drone=ctx.createOscillator();const dg=ctx.createGain();
  drone.type='sine';drone.frequency.value=m.base/2;dg.gain.value=0.08;
  drone.connect(dg);dg.connect(master);drone.start();activeNodes.push(drone);

  m.notes.forEach((ratio,i)=>{
    const freq=m.base*ratio;
    for(let k=0;k<20;k++){
      const t=ctx.currentTime+i*0.3+k*m.bpm*m.notes.length;
      const o=ctx.createOscillator();const g=ctx.createGain();
      o.type=m.wave;o.frequency.value=freq;o.detune.value=(Math.random()-0.5)*8;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.22,t+0.4);
      g.gain.linearRampToValueAtTime(0,t+m.bpm*0.9);
      o.connect(g);g.connect(master);o.start(t);o.stop(t+m.bpm);activeNodes.push(o);
    }
  });
}

function chime(good){
  const ctx=ac();
  const freqs=good?[880,1108,1320]:[220,185,165];
  freqs.forEach((f,i)=>{
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type=good?'sine':'sawtooth';o.frequency.value=f;
    const t=ctx.currentTime+i*0.06;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(good?0.25:0.15,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.001,t+(good?0.8:0.4));
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1);
  });
}

function rescueDrone(on){
  if(!on){stopAll();return;}
  const ctx=ac();const master=ctx.createGain();master.gain.value=0.1;master.connect(ctx.destination);
  [80,85,90].forEach(f=>{
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type='sawtooth';o.frequency.value=f;g.gain.value=0.15;
    o.connect(g);g.connect(master);o.start();activeNodes.push(o);
  });
}

// ════════════════════════════════════════════════════
// SVG AVATARS
// ════════════════════════════════════════════════════
function svgBoy(sz=90){return`<svg width="${sz}" height="${sz}" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
<circle cx="45" cy="24" r="17" fill="#f4c9a0" stroke="#d4a070" stroke-width="0.5"/>
<path d="M28 18 Q45 8 62 18 Q64 26 62 30 Q45 38 28 30 Q26 26 28 18Z" fill="#2a1a0a" opacity="0.8"/>
<circle cx="38" cy="25" r="2.5" fill="#1a0a00"/>
<circle cx="52" cy="25" r="2.5" fill="#1a0a00"/>
<path d="M40 31 Q45 35 50 31" fill="none" stroke="#8a5a3a" stroke-width="1.2" stroke-linecap="round"/>
<rect x="28" y="41" width="34" height="29" rx="6" fill="#1a3a6a"/>
<text x="45" y="59" text-anchor="middle" font-size="8" fill="#6ab0f0" font-family="Inter">MED</text>
<rect x="28" y="60" width="34" height="4" rx="0" fill="#153060"/>
<line x1="28" y1="49" x2="12" y2="62" stroke="#f4c9a0" stroke-width="5" stroke-linecap="round"/>
<line x1="62" y1="49" x2="78" y2="62" stroke="#f4c9a0" stroke-width="5" stroke-linecap="round"/>
<path d="M34 70 Q30 80 28 90" fill="none" stroke="#1a3a6a" stroke-width="5" stroke-linecap="round"/>
<path d="M56 70 Q60 80 62 90" fill="none" stroke="#1a3a6a" stroke-width="5" stroke-linecap="round"/>
<circle cx="12" cy="64" r="5" fill="#f4c9a0"/>
<circle cx="78" cy="64" r="5" fill="#f4c9a0"/>
</svg>`;}

function svgGirl(sz=90){return`<svg width="${sz}" height="${sz}" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
<path d="M26 22 Q28 8 45 6 Q62 8 64 22 Q70 30 66 42 Q56 54 45 54 Q34 54 24 42 Q20 30 26 22Z" fill="#8B2252" opacity="0.9"/>
<circle cx="45" cy="26" r="17" fill="#f4c9a0" stroke="#d4a070" stroke-width="0.5"/>
<path d="M26 38 Q20 52 22 64" fill="none" stroke="#8B2252" stroke-width="7" stroke-linecap="round"/>
<path d="M64 38 Q70 52 68 64" fill="none" stroke="#8B2252" stroke-width="7" stroke-linecap="round"/>
<circle cx="38" cy="27" r="2.5" fill="#1a0a00"/>
<circle cx="52" cy="27" r="2.5" fill="#1a0a00"/>
<path d="M40 33 Q45 37 50 33" fill="none" stroke="#8a5a3a" stroke-width="1.2" stroke-linecap="round"/>
<ellipse cx="36" cy="33" rx="4" ry="2.5" fill="#f0a0a0" opacity="0.4"/>

function liveCandleSVG(color,health){

  return`<svg width="44" height="100" viewBox="0 0 44 100" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="22" cy="70" rx="${8+health*6}" ry="${4+health*4}" fill="${glow}" opacity="${0.1+health*0.15}" class="flame"/>

  <ellipse cx="22" cy="${30-fh/2}" rx="${fw/2}" ry="${fh}" fill="${glow}" opacity="0.9" class="flame"/>
  <ellipse cx="22" cy="${28-fh/2}" rx="${fw/3}" ry="${fh*0.6}" fill="#fffae0" opacity="0.7" class="flame"/>
</svg>`;
}

    {l:'Origin',d:'You arise in the superior salivatory nucleus of the pons — a slender parasympathetic column in the pontine tegmentum.',f:'The superior salivatory nucleus gives preganglionic fibres to both the pterygopalatine and submandibular ganglia via CN VII — same nucleus, different branches.',q:'Which cranial nerve trunk carries you out of the brainstem?',o:['CN IX — glossopharyngeal','CN VII — facial nerve','CN X — vagus nerve'],c:1,fb:'CN VII — you travel as the nervus intermedius, the sensory and parasympathetic root of the facial nerve, which joins the main motor root.',wfb:'CN IX carries fibres to the otic ganglion (inferior salivatory nucleus). CN X is the vagus and supplies thoracic and abdominal viscera. The superior salivatory nucleus specifically outputs via CN VII.'},

    {l:'The synapse',d:'You arrive in the pterygopalatine fossa, the most complex neurovascular crossroads of the skull base, suspended from V2.',f:'The pterygopalatine ganglion is the largest parasympathetic ganglion of the head (~5mm). Sensory fibres from V2 and sympathetic fibres pass through without synapsing — only your parasympathetic fibres synapse here.',q:'The pterygopalatine ganglion is suspended from which nerve?',o:['V2 — maxillary nerve','V3 — mandibular nerve','CN IX'],c:0,fb:'V2 (maxillary nerve). The ganglion hangs by two short roots from the maxillary nerve in the pterygopalatine fossa.',wfb:'V3 suspends the otic and submandibular ganglia (via lingual nerve). CN IX is the nerve of the otic ganglion. The pterygopalatine ganglion is specifically a V2 (maxillary) tributary.'},
    {l:'End organ',d:'Postganglionic fibres scatter to multiple secretomotor targets via borrowed sensory nerves — a characteristic parasympathetic strategy.',f:'Postganglionic fibres hitch-hike on V1 branches (via zygomatic nerve and communicating branch to lacrimal nerve) for the lacrimal gland, and on palatine/nasal branches for mucosal glands. Damage causes dry eye and nasal dryness — common after skull base surgery.',q:'What are the primary secretomotor targets of the pterygopalatine ganglion?',o:['Parotid gland and sublingual gland','Lacrimal gland and nasal/palatine mucosa','Submandibular gland and cornea'],c:1,fb:'Lacrimal gland and nasal/palatine mucosal glands. The lacrimal gland pathway is clinically important after fossa pterygopalatina surgery. The ganglion also plays a role in cluster headache pathophysiology.',wfb:'The parotid gland is the otic ganglion\'s target. The submandibular ganglion supplies submandibular and sublingual glands. Lacrimal and nasal/palatine glands are specifically pterygopalatine territory.'}
  ],summary:'Tears (lacrimal gland) and nasal/palatine secretions. Dry eye post skull base surgery = pterygopalatine injury. Implicated in cluster headache.'},
  {steps:[
    {l:'Origin',d:'You arise again from the superior salivatory nucleus of the pons — same origin as the pterygopalatine pathway, but a different branch of CN VII.',f:'The chorda tympani carries taste from the anterior 2/3 of tongue (via lingual nerve) AND parasympathetic secretomotor fibres to the submandibular ganglion — a combined sensory and autonomic bundle.',q:'Which branch of CN VII carries your preganglionic fibres toward the floor of the mouth?',o:['Greater petrosal nerve','Chorda tympani','Lesser petrosal nerve'],c:1,fb:'The chorda tympani — it leaves CN VII in the descending facial canal, crosses the middle ear between the malleus and incus, then exits to join V3\'s lingual nerve in the infratemporal fossa.',wfb:'The greater petrosal nerve goes to the pterygopalatine ganglion. The lesser petrosal nerve carries CN IX fibres to the otic ganglion. The chorda tympani specifically carries fibres to the submandibular ganglion.'},
    {l:'The foramen',d:'The chorda tympani crosses the middle ear cavity and must exit the skull to reach the infratemporal fossa.',f:'The petrotympanic fissure (Glaserian fissure) is an anatomical landmark in middle ear surgery. The chorda tympani\'s path across the ossicles (between malleus handle and long process of incus) makes it vulnerable in stapedectomy and mastoidectomy — hence post-operative taste disturbance.',q:'Through which fissure does the chorda tympani exit the middle ear?',o:['Foramen ovale','Petrotympanic (Glaserian) fissure','Stylomastoid foramen'],c:1,fb:'The petrotympanic fissure — a narrow slit at the squamotympanic junction, anterior to the tympanic ring. The chorda tympani then travels inferiorly to join the lingual nerve.',wfb:'Foramen ovale transmits V3 and the lesser petrosal nerve. The stylomastoid foramen is the main exit of the facial nerve (motor root). Only the petrotympanic fissure transmits the chorda tympani.'},
    {l:'The synapse',d:'You travel with the lingual nerve through the infratemporal fossa to the floor of the mouth, where a small ganglion awaits.',f:'The submandibular ganglion is the smallest of the four head parasympathetic ganglia (~2mm). It hangs from the lingual nerve by two short roots, positioned just above the deep lobe of the submandibular gland.',q:'Where is the submandibular ganglion located?',o:['Inside the parotid gland','Suspended from the lingual nerve above the submandibular gland','On the hypoglossal nerve in the floor of mouth'],c:1,fb:'Suspended from the lingual nerve, just above the submandibular gland. Postganglionic fibres drop directly into the gland below — one of the shortest postganglionic parasympathetic pathways.',wfb:'The parotid gland contains the otic ganglion\'s target, not the ganglion itself. The hypoglossal nerve is motor to the tongue and carries no parasympathetic fibres. The submandibular ganglion is specifically a lingual nerve tributary.'},
    {l:'End organ',d:'Postganglionic fibres supply two glands that together produce the majority of the body\'s resting saliva.',f:'Submandibular gland ≈70% of resting saliva; sublingual ≈5%. Combined = ~75% of resting output. Bilateral floor-of-mouth surgery causing xerostomia leads to severe dental caries, dysphagia, and reduced quality of life.',q:'Which two glands does the submandibular ganglion supply?',o:['Parotid and sublingual glands','Submandibular and sublingual glands','Submandibular and lacrimal glands'],c:1,fb:'Submandibular and sublingual glands. Together they supply ~75% of resting saliva. Loss from floor-of-mouth surgery is the most common cause of severe xerostomia.',wfb:'The parotid gland (largest salivary gland) is the otic ganglion\'s target. The lacrimal gland is pterygopalatine territory. Only the submandibular ganglion supplies both submandibular and sublingual glands.'}
  ],summary:'Submandibular and sublingual salivation (~75% resting saliva). Chorda tympani at risk in middle ear surgery; xerostomia in floor-of-mouth procedures.'},
  {steps:[
    {l:'Origin',d:'You arise from the inferior salivatory nucleus — a small parasympathetic column in the medulla, the last of the four cranial parasympathetic nuclei.',f:'The inferior salivatory nucleus is the only parasympathetic cranial nucleus located entirely within the medulla. Its sole output is CN IX → otic ganglion → parotid gland.',q:'Which cranial nerve carries your preganglionic fibres from the medulla?',o:['CN VII — facial nerve','CN IX — glossopharyngeal nerve','CN X — vagus nerve'],c:1,fb:'CN IX (glossopharyngeal). Your fibres travel first in its tympanic branch — Jacobson\'s nerve — on an unusual re-entrant route through the middle ear.',wfb:'CN VII carries fibres from the superior salivatory nucleus (pterygopalatine and submandibular ganglia). CN X is the vagus and supplies thoracic/abdominal ganglia. CN IX specifically carries the inferior salivatory nucleus output.'},
    {l:'The foramen',d:'Your route is circuitous — you enter the middle ear via the tympanic canaliculus, cross it as the tympanic plexus, then re-exit as the lesser petrosal nerve.',f:'The lesser petrosal nerve exits the middle cranial fossa near the foramen ovale — sometimes through a small dedicated canal in the petrous temporal bone, sometimes through the foramen ovale itself. Anatomical variation is clinically relevant.',q:'Through which foramen does the lesser petrosal nerve exit to reach the infratemporal fossa?',o:['Foramen ovale or adjacent small canal','Petrotympanic fissure','Foramen spinosum'],c:0,fb:'Near the foramen ovale — through a small dedicated canal (most common), or the foramen ovale itself when the canal is absent. This variation matters in surgical planning.',wfb:'The petrotympanic fissure transmits the chorda tympani (CN VII). The foramen spinosum transmits the middle meningeal artery. The lesser petrosal nerve exits near/through the foramen ovale.'},
    {l:'The synapse',d:'You arrive below the skull base in the infratemporal fossa. The ganglion hangs from V3, medial to the mandibular nerve.',f:'The otic ganglion sits just below the foramen ovale, medial to V3. It is the most inferiorly located of the four head ganglia. Postganglionic fibres then hitch-hike on the auriculotemporal nerve (a V3 branch) to reach the parotid.',q:'The otic ganglion is suspended from which nerve?',o:['V2 — maxillary nerve','V3 — mandibular nerve','CN IX itself'],c:1,fb:'V3 (mandibular nerve). The otic ganglion hangs medial to V3 just below the foramen ovale — a characteristic anatomical relationship used to locate it surgically.',wfb:'V2 suspends the pterygopalatine ganglion. CN IX is the preganglionic nerve, not the carrier for the ganglion. The otic ganglion is specifically a V3 (mandibular) tributary.'},
    {l:'End organ',d:'Postganglionic fibres travel with the auriculotemporal nerve (V3) to reach the parotid gland — the largest salivary gland.',f:'Frey\'s syndrome (auriculotemporal syndrome): after parotidectomy, aberrant regeneration of parasympathetic secretomotor fibres into overlying sweat gland territory causes sweating and flushing when eating. Treated with botulinum toxin or tympanic neurectomy.',q:'What is the target organ — and what complication follows its aberrant reinnervation after surgery?',o:['Submandibular gland — xerostomia','Parotid gland — Frey\'s syndrome (gustatory sweating)','Lacrimal gland — dry eye'],c:1,fb:'Parotid gland. Frey\'s syndrome is the classic post-parotidectomy complication — aberrant parasympathetic fibres grow into overlying sweat glands, causing sweating and flushing during meals.',wfb:'The submandibular gland is the submandibular ganglion\'s target (xerostomia is its loss). The lacrimal gland is pterygopalatine territory. The parotid-Frey\'s syndrome combination is specifically the otic ganglion\'s clinical story.'}
  ],summary:'Parotid salivation. Frey\'s syndrome (gustatory sweating) = aberrant parasympathetic reinnervation of sweat glands after parotidectomy.'}
];

// ════════════════════════════════════════════════════
// GAME LOGIC
// ════════════════════════════════════════════════════
function startGame(){
  curPath=PATHWAYS[selCandle];
  curStep=0;score=0;totalQ=0;answered=false;candleH=1.0;rescueUsed=false;
  rescueIdx=Math.floor(Math.random()*RESCUE_QS.length);
  buildGameShell();
  showScreen('game');
  document.getElementById('gTitle').textContent=CANDLES_DEF[selCandle].ganglion;
  document.getElementById('avStage').innerHTML=AVATARS_DEF[selAvatar].fn(100);
  buildProg();renderStep();
  playAmbient(CANDLES_DEF[selCandle].mood);
}

function buildProg(){
  const p=document.getElementById('progDots');p.innerHTML='';
  curPath.steps.forEach((_,i)=>{const d=document.createElement('div');d.className='p-dot'+(i===0?' curr':'');d.id='pd'+i;p.appendChild(d);});
}
function updateProg(){curPath.steps.forEach((_,i)=>{const d=document.getElementById('pd'+i);if(d)d.className='p-dot'+(i<curStep?'done':i===curStep?' curr':'');});}

function renderStep(){
  clearTimer();
  const s=curPath.steps[curStep];
  document.getElementById('stepTag').textContent=s.l;
  document.getElementById('stepDesc').textContent=s.d;
  document.getElementById('stepFact').textContent=s.f;
  document.getElementById('qText').textContent=s.q;
  document.getElementById('feedbackBox').innerHTML='';
  document.getElementById('nextBtn').style.display='none';
  answered=false;

  // anatomical bg crossfade
  const bg=document.getElementById('anatBg');
  bg.style.opacity='0';
  setTimeout(()=>{bg.innerHTML=BG_STAGES[curStep]();bg.style.opacity='1';},300);

  // candle live
  document.getElementById('candleLive').innerHTML=liveCandleSVG(CANDLES_DEF[selCandle].color,candleH);

  // answers with stagger
  const an=document.getElementById('answers');an.innerHTML='';
  s.o.forEach((opt,i)=>{
    const b=document.createElement('button');b.className='ans-btn';b.textContent=opt;
    b.style.cssText=`animation:slideUp 0.35s ${i*0.1}s var(--ease) both`;
    b.onclick=()=>handleAnswer(i,s,b);
    an.appendChild(b);
  });
  updateProg();
  startTimer(s);
}

function startTimer(s){
  timeLeft=20;updateTimerUI(20);
  timerID=setInterval(()=>{
    timeLeft--;updateTimerUI(timeLeft);
    if(timeLeft<=0){clearTimer();handleAnswer(-1,s,null);}
  },1000);
}
function clearTimer(){if(timerID){clearInterval(timerID);timerID=null;}}
function updateTimerUI(t){
  const arc=document.getElementById('timerArc');
  const txt=document.getElementById('timerTxt');
  if(!arc||!txt)return;
  const pct=t/20;
  arc.setAttribute('stroke-dashoffset',String(125.6*(1-pct)));
  arc.setAttribute('stroke',t>8?'#c8902a':t>4?'#e06010':'#cc2010');
  txt.textContent=t;
  txt.setAttribute('fill',t>8?'#c8902a':t>4?'#e06010':'#cc2010');
}

function handleAnswer(i,s,btn){
  if(answered)return;answered=true;clearTimer();totalQ++;
  document.querySelectorAll('.ans-btn').forEach(b=>{b.disabled=true;b.style.pointerEvents='none';});
  const fb=document.getElementById('feedbackBox');
  const stage=document.getElementById('avStage');

  if(i===s.c){
    score++;if(btn)btn.classList.add('correct');
    fb.innerHTML=`<div class="feedback good">${s.fb}</div>`;
    candleH=Math.max(0.1,candleH-0.07);
    stage.classList.remove('backward');stage.classList.add('forward');
    setTimeout(()=>stage.classList.remove('forward'),700);
    chime(true);
    document.getElementById('nextBtn').style.display='block';
    document.getElementById('nextBtn').textContent=curStep>=curPath.steps.length-1?'Reach the end organ →':'Continue deeper →';
  } else {
    if(btn)btn.classList.add('wrong');
    const corrBtn=document.querySelectorAll('.ans-btn')[s.c];
    if(corrBtn)setTimeout(()=>corrBtn.classList.add('correct'),600);
    fb.innerHTML=`<div class="feedback bad">${i===-1?'Time\'s up! ':''}<strong>Correct answer shown.</strong> ${s.wfb||s.fb}</div>`;
    candleH=Math.max(0.08,candleH-0.22);
    stage.classList.remove('forward');stage.classList.add('backward');
    setTimeout(()=>stage.classList.remove('backward'),600);
    chime(false);
    updateFlameUI();
    document.getElementById('candleLive').innerHTML=liveCandleSVG(CANDLES_DEF[selCandle].color,candleH);

    if(candleH<=0.28&&!rescueUsed){
      setTimeout(()=>showRescue(),1400);
    } else {
      document.getElementById('nextBtn').style.display='block';
      document.getElementById('nextBtn').textContent=curStep>=curPath.steps.length-1?'Reach the end organ →':'Continue deeper →';
    }
  }
  updateFlameUI();
  document.getElementById('candleLive').innerHTML=liveCandleSVG(CANDLES_DEF[selCandle].color,candleH);
}

function updateFlameUI(){
  const pct=Math.round(candleH*100);
  const fill=document.getElementById('flameFill');
  const pctEl=document.getElementById('flamePct');
  if(!fill||!pctEl)return;
  fill.style.width=pct+'%';
  fill.style.background=candleH>0.5?'#c8902a':candleH>0.25?'#aa6010':'#881000';
  pctEl.textContent=pct+'%';
}

function showRescue(){
  rescueUsed=true;
  rescueDrone(true);
  const rq=RESCUE_QS[rescueIdx];
  document.getElementById('rescueQ').textContent=rq.q;
  const opts=document.getElementById('rescueOpts');opts.innerHTML='';
  rq.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.className='rescue-opt';b.textContent=o;
    b.onclick=()=>{
      document.querySelectorAll('.rescue-opt').forEach(x=>{x.disabled=true;x.style.pointerEvents='none';});
      if(i===rq.c){
        b.classList.add('correct');
        document.getElementById('rescueFb').textContent=rq.fb;
        candleH=Math.min(1.0,candleH+0.5);chime(true);
      } else {
        b.classList.add('wrong');
        document.querySelectorAll('.rescue-opt')[rq.c].classList.add('correct');
        document.getElementById('rescueFb').textContent='Not quite — '+rq.fb;
        candleH=Math.min(1.0,candleH+0.25);
      }
      updateFlameUI();
      document.getElementById('candleLive').innerHTML=liveCandleSVG(CANDLES_DEF[selCandle].color,candleH);
      document.getElementById('rescueContinue').style.display='inline-block';
      rescueDrone(false);playAmbient(CANDLES_DEF[selCandle].mood);
    };
    opts.appendChild(b);
  });
  document.getElementById('rescueFb').textContent='';
  document.getElementById('rescueContinue').style.display='none';
  document.getElementById('rescueScreen').classList.add('show');
}

function rescueContinue(){
  document.getElementById('rescueScreen').classList.remove('show');
  // retry same step
  answered=false;
  const s=curPath.steps[curStep];
  document.getElementById('feedbackBox').innerHTML='';
  document.getElementById('nextBtn').style.display='none';
  const an=document.getElementById('answers');an.innerHTML='';
  s.o.forEach((opt,i)=>{
    const b=document.createElement('button');b.className='ans-btn';b.textContent=opt;
    b.style.cssText=`animation:slideUp 0.35s ${i*0.1}s var(--ease) both`;
    b.onclick=()=>handleAnswer(i,s,b);an.appendChild(b);
  });
  startTimer(s);
}

function nextStep(){
  curStep++;
  if(curStep>=curPath.steps.length){endGame();return;}
  renderStep();
}

    Tap to copy result and share with classmates
  </div>
  <div class="btn-row"><button class="end-btn" onclick="goHome()">Try another pathway</button></div>`;
  showScreen('end');
  const eg=document.getElementById('endGrid');
  PATHWAYS.forEach((p,i)=>{
    const c=document.createElement('div');c.className='end-card';c.style.animationDelay=`${i*0.15}s`;
    c.innerHTML=`<div class="end-card-g">${CANDLES_DEF[i].ganglion}</div><div class="end-card-e">${p.summary}</div>`;
    eg.appendChild(c);
  });

function goHome(){stopAll();buildLanding();showScreen('landing');}

function toggleMusic(){
  musicOn=!musicOn;
  const btn=document.getElementById('musicBtn');
  if(btn)btn.textContent='\u266a '+(musicOn?'On':'Off');
  if(musicOn)playAmbient(curPath?CANDLES_DEF[selCandle].mood:'landing');
  else stopAll();
}

window.addEventListener('load',()=>{buildLanding();showScreen('landing');});
</script>
</body>
</html>
